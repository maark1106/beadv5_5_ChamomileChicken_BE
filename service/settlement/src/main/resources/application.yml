server:
  port: 9002

spring:
  application:
    name: settlement
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: false

clients:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:9003}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true

settlement:
  batch:
    calculate:
      cron: "${SETTLEMENT_BATCH_CALCULATE_CRON:0 0 2 1 * *}"
      target-month-offset-months: ${SETTLEMENT_BATCH_CALCULATE_TARGET_MONTH_OFFSET_MONTHS:1}
    transfer:
      cron: "${SETTLEMENT_BATCH_TRANSFER_CRON:0 */5 2-3 2 * *}"
      target-month-offset-months: ${SETTLEMENT_BATCH_TRANSFER_TARGET_MONTH_OFFSET_MONTHS:1}
    lock:
      expire-minutes: ${SETTLEMENT_BATCH_LOCK_EXPIRE_MINUTES:360}
